# UptimePilot — publieke statuspagina (blok 2026-08-06/S7.24)
#
# ops.uptimepilot.nl staat BEWUST niet in `sites`: die endpoint zit
# achter een IP-whitelist (blok S7.17/S7.18) en zou voor de GitHub
# Actions-runners (wisselende IP's) permanent als "down" verschijnen.
# Verruiming van die whitelist voor dit doel is expliciet afgewezen —
# zie het blok en het decision-fragment in de uptimepilot-repo.
# Uitzondering (blok 2026-10-23/S41.38): ops2.uptimepilot.nl/health is een exacte nginx-route
# buiten de whitelist (alleen GET/HEAD, body {"code":0}); de rest van de vhost blijft 403.
owner: Frankus81
repo: uptimepilot-status

sites:
  - name: UptimePilot
    url: https://uptimepilot.nl/
  - name: UptimePilot Analytics
    url: https://analytics.uptimepilot.nl/script.js
  - name: Platform
    url: https://ops2.uptimepilot.nl/health
    method: GET
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"code":0'

status-website:
  cname: status.uptimepilot.nl
  logoUrl: https://raw.githubusercontent.com/Frankus81/uptimepilot-status/master/assets/uptimepilot-logo.svg
  name: UptimePilot Status
  introTitle: "**UptimePilot Status**"
  introMessage: Actuele status van de UptimePilot-diensten. Data rechtstreeks uit deze GitHub-repository — geen eigen server, dus onafhankelijk van onze eigen infrastructuur.
  navbar:
    - title: Status
      href: /
    - title: UptimePilot
      href: https://uptimepilot.nl/
